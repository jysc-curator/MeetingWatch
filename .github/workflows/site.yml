name: Scrape Build Deploy

on:
  schedule:
    # GitHub may delay scheduled jobs, so execution never depends on the hour
    # at which a runner eventually starts.
    - cron: "3 7,19 * * *" # midnight/noon MST; 1am/1pm MDT
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Scrapers only collect source metadata. The dedicated editorial step is the
  # single production path allowed to call the model.
  SUMMARIZER_DISABLE: "1"
  SUMMARIZER_MODEL: gpt-5-mini
  PDF_SUMMARY_MAX_PAGES: "30"
  PDF_SUMMARY_MAX_CHARS: "90000"
  PDF_SUMMARY_MAX_BULLETS: "8"
  PDF_SUMMARY_DEBUG: "1"

concurrency:
  group: daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    env:
      SALIDA_CIVICCLERK_URL: https://salidaco.portal.civicclerk.com
      SALIDA_CIVICCLERK_ALT_HOSTS: https://salidaco.portal.civicclerk.com,https://salidaco.civicclerk.com,https://cityofsalida.civicclerk.com

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore editorial briefing cache
        uses: actions/cache@v5
        with:
          path: data/cache/editorial_briefings
          key: editorial-${{ runner.os }}-${{ hashFiles('scraper/summarize.py') }}-${{ github.run_id }}
          restore-keys: |
            editorial-${{ runner.os }}-${{ hashFiles('scraper/summarize.py') }}-

      - name: Cron heartbeat
        run: |
          echo "event=${{ github.event_name }}"
          echo "utc=$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "denver=$(TZ=America/Denver date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Seed prior published datasets
        run: |
          mkdir -p data
          curl -fsSL "https://jysc-curator.github.io/MeetingWatch/data/meetings.json" -o data/meetings.json || true
          curl -fsSL "https://jysc-curator.github.io/MeetingWatch/data/history.json" -o data/history.json || true

      - name: Run scrapers
        env:
          DEBUG: "1"
        run: |
          python -m scraper.main
          test -d data && ls -la data || (echo "no data dir generated" && exit 1)

      - name: Validate generated datasets
        run: python scripts/validate_data.py --max-age-hours 2 --min-active 1

      - name: Generate evidence-backed editorial briefings
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euxo pipefail
          mkdir -p data/cache/editorial_briefings
          python -m scraper.summarize \
            --input data/meetings.json \
            --out data/cache/editorial_briefings

      - name: Validate editorial publishing contract
        run: python scripts/validate_data.py --max-age-hours 2 --min-active 1

      - name: Report editorial coverage
        run: |
          set -euo pipefail
          shopt -s nullglob
          metas=(data/cache/editorial_briefings/*.meta.json)
          if [ ${#metas[@]} -eq 0 ]; then
            echo "No editorial metadata was produced."
            exit 1
          fi
          jq -s '{verified: map(select(.status == "verified")) | length,
                  withheld: map(select(.status == "quality-gate-failed" or .status == "generation-unavailable")) | length,
                  awaiting_agenda: map(select(.status == "not-published")) | length}' "${metas[@]}"

      - name: Upload data artifact
        uses: actions/upload-artifact@v7
        with:
          name: scrape-data
          path: data/

  build:
    runs-on: ubuntu-latest
    needs: scrape
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download scrape data
        uses: actions/download-artifact@v8
        with:
          name: scrape-data
          path: data

      - name: Validate downloaded datasets
        run: python scripts/validate_data.py --max-age-hours 2 --min-active 1

      - name: Build editorial briefing site
        run: |
          python scripts/build_site.py --data-dir data --output-dir _site
          cp demo.html _site/demo.html

      - name: Sanity-check published files
        run: |
          test -s _site/index.html
          test -s _site/data/meetings.json
          test -s _site/data/history.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
